<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versión 1: Front (Redibujado entero)</title>
</head>
<body>
    <h1>Versión 1: Formulario Tradicional (Front)</h1>
    <p>Al seleccionar una comunidad se envía el formulario al servidor PHP por <strong>POST</strong> y se recarga/redibuja la página entera con los resultados.</p>

    <form action="v1_back.php" method="POST">
        <label for="comunidad">Comunidad Autónoma:</label>
        <select name="comunidad" id="comunidad" onchange="this.form.submit()">
            <option value="" disabled selected>-- Selecciona una comunidad --</option>
            <option value="Andalucía">Andalucía</option>
            <option value="Aragón">Aragón</option>
            <option value="Asturias (Principado de)">Asturias (Principado de)</option>
            <option value="Canarias">Canarias</option>
            <option value="Cantabria">Cantabria</option>
            <option value="Castilla y León">Castilla y León</option>
            <option value="Castilla-La Mancha">Castilla-La Mancha</option>
            <option value="Cataluña">Cataluña</option>
            <option value="Ceuta (Ciudad de)">Ceuta (Ciudad de)</option>
            <option value="Comunidad Valenciana">Comunidad Valenciana</option>
            <option value="Extremadura">Extremadura</option>
            <option value="Galicia">Galicia</option>
            <option value="Islas Baleares">Islas Baleares</option>
            <option value="Madrid (Comunidad de)">Madrid (Comunidad de)</option>
            <option value="Melilla (Ciudad de)">Melilla (Ciudad de)</option>
            <option value="Murcia (Región de)">Murcia (Región de)</option>
            <option value="Navarra (Comunidad Foral de)">Navarra (Comunidad Foral de)</option>
            <option value="País Vasco">País Vasco</option>
            <option value="Rioja (La)">Rioja (La)</option>
        </select>

        <label for="provincia">Provincias:</label>
        <select name="provincia" id="provincia">
            <option value="">-- Esperando selección de comunidad --</option>
        </select>

        <noscript>
            <button type="submit">Cargar provincias</button>
        </noscript>
    </form>
</body>
</html>
