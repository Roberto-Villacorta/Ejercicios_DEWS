<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
    <script>
        var xmlhttp;
        function accionAjax() {
            document.getElementById('resultado').innerHTML = xmlhttp.responseText;
        }

        function consultarInfo(accion) {
            var producto = document.getElementById('pr').value;
            xmlhttp = new XMLHttpRequest();
            xmlhttp.open('POST', 'ajax.php', true);
            xmlhttp.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xmlhttp.onreadystatechange = function () {
                if (xmlhttp.readyState === 4 && xmlhttp.status === 200) {
                    accionAjax();
                }
            };
            xmlhttp.send("pr=" + encodeURIComponent(producto) +
                "&accion=" + encodeURIComponent(accion));
        }
    </script>
</head>

<body>
    <h1>Gestión de productos</h1>

    <form method="post" action="javascript:void(0);">
        <label for="pr">Introduce un producto:</label>
        <input type="text" name="pr" id="pr">

        <button type="button" onclick="consultarInfo('consultar')">
            Consultar producto
        </button>

        <button type="button" onclick="consultarInfo('estadisticas')">
            Estadísticas
        </button>
    </form>

    <div id="resultado">

    </div>
</body>

</html>
